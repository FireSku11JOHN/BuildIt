<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="/css/main.css">
        <link rel="stylesheet" href="/css/login.css">

        <title>Entrar - Build It</title>
    </head>
    <body>
        <main>
            <div class="form-container">
                <a href="" class="container_logo">
                    <img class="logo"
                    src="/src/logo_buildit-desktop.svg"
                    alt="Logo Buildit">
                </a>
                <p class="title">Login</p>
                <form class="form">
                    <div class="input-group">
                        <input type="text" name="username" id="username" placeholder="">
                        <label for="username">Nome</label>
                    </div>
                    <div class="input-group">
                        <input type="text" name="email" id="email" placeholder="">
                        <label for="email">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="password" placeholder="" >
                        <label for="password">Senha</label>
                    </div>
                    <div class="input-group">
                        <input type="password-repeat" name="password-repeat" id="password-repeat" placeholder="" >
                        <label for="password-repeat">Repita a Senha</label>
                    </div>
                    <button class="sign">Criar</button>
                </form>
                <div class="social-message">
                    <div class="line"></div>
                    <!-- <p class="message">Login with social accounts</p> -->
                    <div class="line"></div>
                </div>
                <p class="signup">Já possui uma conta?
                    <a rel="noopener noreferrer" href="login.html"style="color: aqua;">Entrar</a>
                </p>
            </div>
        </main>
    </body>
</html>
